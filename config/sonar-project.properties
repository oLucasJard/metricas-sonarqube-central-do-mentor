# =====================================================================
# Configuracao da analise SonarQube - Central do Mentor
# Trabalho de Metricas e Estimativas de Software
# =====================================================================

# --- Identificacao do projeto ---------------------------------------
# projectKey: identificador unico dentro do servidor Sonar (nao pode repetir).
sonar.projectKey=central-do-mentor
# projectName: nome exibido no dashboard.
sonar.projectName=Central do Mentor
sonar.projectVersion=1.0

# --- Onde esta o codigo de producao ---------------------------------
# O Sonar so mede o que estiver listado aqui. Como o repositorio e um
# monorepo (backend Node + frontend React), apontamos as duas pastas.
sonar.sources=backend/src,frontend/src

# --- Onde estao os testes -------------------------------------------
# Os testes ficam ao lado do codigo (colocados), entao declaramos a mesma
# pasta e usamos test.inclusions para o Sonar separar teste de producao.
# Isso importa: arquivo de teste NAO deve contar como codigo de producao
# nas metricas de complexidade, duplicacao e code smells.
sonar.tests=frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# --- O que ignorar --------------------------------------------------
# Dependencias e artefatos de build nao sao codigo autoral: se entrarem
# na analise, poluem todas as metricas (milhares de smells de terceiros).
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.vite/**,**/*.min.js

# --- COVERAGE (metrica que exige configuracao) ----------------------
# O SonarQube NAO executa testes. Ele apenas le o relatorio lcov que o
# Vitest gerou com `npm run test:coverage`. Sem esta linha, a metrica
# Coverage aparece vazia no dashboard.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# --- tsconfig usado pela analise ------------------------------------
# O tsconfig.app.json do projeto usa opcoes do TypeScript 5.8 que o
# analisador nao reconhece. Apontamos um tsconfig simplificado, criado
# so para a analise, que nao interfere no build da aplicacao.
sonar.typescript.tsconfigPath=frontend/tsconfig.sonar.json

# --- Encoding -------------------------------------------------------
# O projeto tem acentuacao em portugues; sem UTF-8 o Sonar acusa erro.
sonar.sourceEncoding=UTF-8
